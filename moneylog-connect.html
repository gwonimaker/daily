<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>머니로그 · 투자 기록 연결</title><style>body{font:16px/1.7 system-ui,sans-serif;background:#f3f6f3;color:#294c3c;margin:0;padding:30px}main{max-width:520px;margin:35px auto;background:white;padding:30px;border-radius:20px;border:1px solid #dfe8df}h1{font-size:25px}p{color:#6b7d71}button,select{font:inherit;width:100%;padding:13px;border-radius:9px;margin:8px 0;border:1px solid #c9d8cd}button{background:#2d6a53;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:wait}small{display:block;color:#839085}#status{white-space:pre-wrap}label{display:block;margin-top:15px}</style><script src="https://accounts.google.com/gsi/client" async defer></script></head>
<body><main><small>송유네 머니로그</small><h1>Google Drive 투자 기록 연결</h1><p>기존 투자 앱의 <b>invest-tracker.json</b>을 읽어 머니로그에 저장합니다. Google 로그인 정보는 이 창에서만 사용되며 원본 파일은 수정하지 않습니다.</p><p id="status" role="status">연결을 준비하고 있습니다.</p><button id="connect" disabled>Google 계정으로 불러오기</button><div id="files" hidden><label for="file">연결할 투자 기록 파일</label><select id="file"></select><button id="read">선택한 기록 연결</button></div><small>머니로그에 저장한 뒤에도 ‘Drive 새로고침’으로 최신 기록을 가져올 수 있어요.</small></main>
<script>
'use strict';
const TARGET='https://songyu-moneylog-preview.gwoni-2.chatgpt.site';
const nonce=new URLSearchParams(location.hash.slice(1)).get('nonce');
const status=document.getElementById('status'),connect=document.getElementById('connect');
let accessToken='',loaded=false,completed=false,client;
const ready=!!window.opener&&/^[a-f0-9]{32}$/.test(nonce||'');
const setStatus=s=>{status.textContent=s};
function notify(type,extra={}){window.opener?.postMessage({type,nonce,...extra},TARGET)}
if(!ready){setStatus('머니로그의 Google Drive 연결 버튼으로 이 창을 열어 주세요.');}
else {const wait=setInterval(()=>{if(!window.google?.accounts?.oauth2)return;clearInterval(wait);connect.disabled=false;setStatus('기존 투자 기록에 연결한 Google 계정을 선택해 주세요.');},250);setTimeout(()=>{clearInterval(wait);if(connect.disabled)setStatus('Google 로그인 도구를 불러오지 못했습니다. 창을 닫고 다시 연결해 주세요.');},15000)}
async function drive(path){const r=await fetch('https://www.googleapis.com/drive/v3/'+path,{headers:{Authorization:'Bearer '+accessToken},signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error(r.status===401?'Google 연결이 만료되었습니다. 다시 로그인해 주세요.':'Drive 파일을 읽지 못했습니다. ('+r.status+')');return r}
connect.onclick=()=>{connect.disabled=true;setStatus('Google 계정을 확인하고 있습니다.');client=google.accounts.oauth2.initTokenClient({client_id:'210029436571-ppf3577p25dbv4t1l73t94io3h68vq71.apps.googleusercontent.com',scope:'https://www.googleapis.com/auth/drive.file',error_callback:()=>{connect.disabled=false;setStatus('로그인이 취소되었거나 팝업이 차단되었습니다. 다시 시도해 주세요.');},callback:async r=>{if(!r.access_token){connect.disabled=false;setStatus('Google 연결이 취소되었습니다. 다시 시도해 주세요.');return}accessToken=r.access_token;try{setStatus('Drive의 투자 기록 파일을 찾고 있습니다.');const query=new URLSearchParams({q:"name='invest-tracker.json' and trashed=false",pageSize:'100',fields:'files(id,name,modifiedTime)',orderBy:'modifiedTime desc'});const list=await (await drive('files?'+query)).json();const files=list.files||[];if(!files.length)throw Error('투자 기록 파일이 없습니다. 기존 투자 페이지에서 Drive 저장을 먼저 눌러 주세요.');const select=document.getElementById('file');select.replaceChildren();let savedId='';try{savedId=JSON.parse(localStorage.getItem('investTrackerDrive.v1')||'{}').fileId||''}catch{}for(const f of files){const option=document.createElement('option');option.value=f.id;option.textContent=f.name+' · '+new Date(f.modifiedTime).toLocaleString('ko-KR');select.append(option)}if(files.some(f=>f.id===savedId))select.value=savedId;document.getElementById('files').hidden=false;setStatus('연결할 파일을 확인하고 ‘선택한 기록 연결’을 눌러 주세요.');}catch(e){setStatus(e.message)}finally{connect.disabled=false}}});client.requestAccessToken({prompt:''});};
document.getElementById('read').onclick=async()=>{const button=document.getElementById('read');button.disabled=true;try{const id=document.getElementById('file').value;setStatus('투자 기록을 읽고 있습니다.');const response=await drive('files/'+encodeURIComponent(id)+'?alt=media');if(Number(response.headers.get('content-length'))>5000000)throw Error('투자 기록 파일이 너무 큽니다.');const text=await response.text();if(text.length>5000000)throw Error('투자 기록 파일이 너무 큽니다.');const data=JSON.parse(text);if(!Array.isArray(data.entries)||!data.entries.length)throw Error('파일에 유효한 투자 기록이 없습니다.');loaded=true;notify('moneylog-investment-data',{data:{entries:data.entries,pointFarming:data.pointFarming||{},fixedExpenses:data.fixedExpenses||{},savedAt:data.savedAt||data.exportedAt||''}});setStatus('머니로그에 기록을 저장하고 있습니다.');setTimeout(()=>{if(!completed)setStatus('머니로그에서 연결 상태를 확인해 주세요. 응답이 없으면 창을 닫고 다시 연결해 주세요.');},25000)}catch(e){button.disabled=false;setStatus(e.message)}};
window.addEventListener('message',e=>{if(e.origin!==TARGET||e.source!==window.opener||e.data?.nonce!==nonce||!loaded)return;if(e.data.type==='moneylog-saved'){completed=true;accessToken='';setStatus(e.data.count+'건을 머니로그에 연결했습니다. 창을 닫고 머니로그로 돌아가세요.');document.getElementById('files').hidden=true;connect.hidden=true}else if(e.data.type==='moneylog-error'){setStatus('머니로그 저장 실패: '+String(e.data.message||'다시 시도해 주세요.'));document.getElementById('read').disabled=false}});
</script></body></html>
